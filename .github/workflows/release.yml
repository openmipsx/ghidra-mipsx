# Builds the extension for each supported Ghidra version and, on a v* tag,
# publishes the zips as a GitHub release. Ghidra extensions only install into
# the exact Ghidra version they were built against, hence one zip per version.
# Only 12.2 is listed: the loader uses the Option builder API added in 12.2.
name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ghidra: '12.2'
            date: '20261016'
            java: '25'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Download Ghidra ${{ matrix.ghidra }}
        run: |
          zip=ghidra_${{ matrix.ghidra }}_PUBLIC_${{ matrix.date }}.zip
          curl -fsSL -o "$RUNNER_TEMP/$zip" \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${{ matrix.ghidra }}_build/$zip"
          unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP"
          echo "GHIDRA_INSTALL_DIR=$RUNNER_TEMP/ghidra_${{ matrix.ghidra }}_PUBLIC" >> "$GITHUB_ENV"

      # The Gradle build packages the .slaspec but does not compile it, so
      # compile it first to ship the .sla rather than leave it to Ghidra.
      - name: Compile SLEIGH
        run: |
          "$GHIDRA_INSTALL_DIR/support/sleigh" -a data/languages
          test -f data/languages/mipsx.sla

      - name: Build extension
        run: |
          "$GHIDRA_INSTALL_DIR/support/gradle/gradlew"
          ls -l dist/
          unzip -l dist/*.zip | grep -q 'data/languages/mipsx\.sla$'

      - uses: actions/upload-artifact@v7
        with:
          name: ghidra-mipsx-ghidra_${{ matrix.ghidra }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
